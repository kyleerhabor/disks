name: Build
on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  workflow_dispatch:
permissions: {}
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"

          # Decode base64-encoded P12 and write to a temporary file
          echo "$DEVELOPER_ID_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/id.p12"

          # Create a temporary keychain and import the certificate
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/id.p12" \
            -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/["[:space:]]//g')

          rm -f "$RUNNER_TEMP/id.p12"
      - name: Install provisioning profile
        env:
          DEVELOPER_ID_PROVISIONING_PROFILE: ${{ vars.DEVELOPER_ID_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail

          PROVISIONING_PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROVISIONING_PROFILES"
          echo "$DEVELOPER_ID_PROVISIONING_PROFILE" | openssl base64 -d -A -out "$RUNNER_TEMP/profile.provisionprofile"

          # The installed filename must be the profile's UUID for Xcode to discover it.
          PLIST=$(security cms -D -i "$RUNNER_TEMP/profile.provisionprofile")
          UUID=$(echo "$PLIST" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.provisionprofile" "$PROVISIONING_PROFILES/$UUID.provisionprofile"
          rm -f "$RUNNER_TEMP/profile.provisionprofile"
      - name: Archive app
        run: |
          xcodebuild \
            -project Disks.xcodeproj \
            -scheme Disks \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath dist/Disks.xcarchive \
            DEVELOPMENT_TEAM=UYJ357XWK6 \
            ONLY_ACTIVE_ARCH=NO \
            archive
      - name: Cleanup keychain
        if: ${{ !cancelled() }}
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - name: Notarize app
        env:
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail

          APP=dist/Disks.xcarchive/Products/Applications/Disks.app
          KEY="$RUNNER_TEMP/AuthKey.p8"

          echo "$ASC_KEY_P8" | openssl base64 -d -A -out "$KEY"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait

          rm -f "$KEY" "$RUNNER_TEMP/notarize.zip"
      - name: Staple app
        run: |
          APP=dist/Disks.xcarchive/Products/Applications/Disks.app
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
      # There's no ditto on Linux, so we need to package both the archive and app, even though the archive contains the
      # app.
      - name: Package archive
        run: |
          APP=dist/Disks.xcarchive/Products/Applications/Disks.app
          ditto -c -k --keepParent "$APP" Disks.app.zip
          ditto -c -k --keepParent dist/Disks.xcarchive Disks.xcarchive.zip
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            Disks.app.zip
            Disks.xcarchive.zip
  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes dist/Disks.app.zip dist/Disks.xcarchive.zip
